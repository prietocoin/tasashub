<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TasasHub Mobile - Gestión Unificada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#040a17',
            cardDark: '#0b1326',
            borderDark: '#1e293b',
            accentCyan: '#38bdf8',
            accentGreen: '#34d399',
            accentOrange: '#f97316',
            accentPurple: '#a855f7',
            accentRed: '#fb7185'
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #040a17; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="bg-brandDark text-slate-100 min-h-screen pb-24 font-sans">

  <!-- HEADER GLOBAL (ACCIONES MASIVAS / GENERALES) -->
  <header class="sticky top-0 z-30 bg-cardDark/95 backdrop-blur-md border-b border-borderDark p-3 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 font-bold text-base">
          ⚡
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-white leading-tight">TasasHub Engine</h1>
          <p class="text-[10px] text-slate-400">Control Global & Socios</p>
        </div>
      </div>

      <!-- CONTROLES GENERALES (LOTE COMPLETO) -->
      <div class="flex items-center gap-2">
        <!-- Switch Prueba General -->
        <label class="flex items-center gap-1.5 bg-slate-900 border border-borderDark px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-cyan-400 cursor-pointer">
          <span class="text-[10px] text-slate-400">Prueba Lote:</span>
          <input type="checkbox" id="globalTestSwitch" checked class="sr-only peer" onchange="toggleGlobalTestMode(this.checked)">
          <div class="w-7 h-4 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-cyan-500 relative"></div>
        </label>

        <!-- Reenviar Lote Completo (General) -->
        <button onclick="dispararLoteGeneral()" class="px-3 py-1.5 bg-amber-500/10 border border-amber-500/40 text-amber-400 rounded-xl text-xs font-bold active:scale-95 transition flex items-center gap-1">
          ⚡ <span>Lote Completo</span>
        </button>

        <button onclick="showToast('📑 Borrador Cargado')" class="p-2 bg-purple-500/10 border border-purple-500/40 text-purple-400 rounded-lg text-xs font-bold active:scale-95 transition">
          📑 Hoo
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-3 space-y-4">

    <!-- SELECTOR DE PESTAÑAS (TABS) -->
    <div class="grid grid-cols-2 bg-cardDark p-1 rounded-xl border border-borderDark text-xs font-bold">
      <button id="btnTab1" onclick="switchTab(1)" class="py-2.5 rounded-lg bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-center transition">
        📊 Monitor Global
      </button>
      <button id="btnTab2" onclick="switchTab(2)" class="py-2.5 rounded-lg text-slate-400 hover:text-white text-center transition">
        👤 Checklist Socio
      </button>
    </div>

    <!-- TAB 1: MONITOR GLOBAL -->
    <div id="tab1" class="space-y-3">
      <div class="flex items-center justify-between text-xs px-1">
        <span class="font-bold text-emerald-400 tracking-wider">● PROD VS. NUEVO LOTE</span>
        <span id="lblLoteActual" class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-extrabold px-2.5 py-0.5 rounded-full text-[11px]">
          Lote: --
        </span>
      </div>

      <div id="gridMonitor" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2.5">
        <!-- Carga dinámica vía API -->
      </div>
    </div>

    <!-- TAB 2: CHECKLIST DE SOCIO -->
    <div id="tab2" class="hidden space-y-3">
      
      <!-- BARRA DE SOCIO ACTIVO -->
      <div class="bg-cardDark border border-borderDark rounded-xl p-3 flex items-center justify-between gap-2 shadow-sm">
        <button onclick="openPartnerSheet()" class="flex-1 flex items-center justify-between bg-slate-900 border border-borderDark active:border-purple-500 px-3 py-2.5 rounded-xl text-left transition">
          <div class="flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-lg bg-purple-500/20 text-purple-300 flex items-center justify-center font-bold text-xs">👤</span>
            <div>
              <div id="lblSelectedPartner" class="text-xs font-extrabold text-white">Seleccionar Socio...</div>
              <div id="lblPartnerBase" class="text-[10px] text-slate-400">Toque para cambiar (70 disponibles)</div>
            </div>
          </div>
          <span class="text-slate-400 text-xs">▼</span>
        </button>

        <!-- SWITCH PERFIL ON/OFF -->
        <button id="btnTogglePerfil" onclick="togglePerfilState()" class="px-3 py-2.5 rounded-xl text-[11px] font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 active:scale-95 transition">
          ON
        </button>
      </div>

      <!-- BANNER SOCIO OFF -->
      <div id="bannerSocioOff" class="hidden bg-rose-500/10 border border-rose-500/40 text-rose-300 p-3 rounded-xl text-xs text-center font-bold">
        ⚠️ Perfil inactivo. Actívalo con el botón "ON" para modificar monedas.
      </div>

      <!-- CONTADORES Y ACCIONES MÓVILES -->
      <div id="checklistControls" class="flex items-center justify-between text-xs px-1">
        <div class="text-slate-400 text-[11px]">
          Activos: <strong id="lblActiveCount" class="text-cyan-400">0</strong> / <span id="lblTotalCount">0</span>
        </div>
        <div class="flex gap-1.5">
          <button onclick="setAllChecklist(true)" class="px-2.5 py-1 bg-slate-800 border border-borderDark rounded-lg font-bold text-slate-200 text-[11px] active:scale-95">
            ☑️ Todos
          </button>
          <button onclick="setAllChecklist(false)" class="px-2.5 py-1 bg-slate-800 border border-borderDark rounded-lg font-bold text-slate-200 text-[11px] active:scale-95">
            🔳 Ninguno
          </button>
        </div>
      </div>

      <!-- GRID CHECKLIST DE PAÍSES -->
      <div id="checklistGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5">
        <!-- Renderizado dinámico -->
      </div>
    </div>

  </main>

  <!-- BARRA INFERIOR FIJA DE NAVEGACIÓN Y GUARDADO -->
  <div id="stickyFooter" class="hidden fixed bottom-0 left-0 right-0 bg-cardDark/95 backdrop-blur-md border-t border-borderDark p-3 z-30">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <button onclick="verVistaPrevia()" class="p-2.5 bg-slate-800 border border-borderDark text-slate-200 text-xs font-bold rounded-xl active:scale-95 flex items-center gap-1.5">
        👁️ <span>Ver Previa</span>
      </button>

      <button onclick="guardarCambiosSocio()" class="flex-1 max-w-[200px] py-2.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-extrabold rounded-xl shadow-lg shadow-purple-900/40 active:scale-95 transition">
        💾 Guardar Cambios
      </button>
    </div>
  </div>

  <!-- PANEL BOTTOM SHEET (BUSCADOR DE SOCIOS) -->
  <div id="partnerSheet" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
    <div class="bg-cardDark border-t border-borderDark rounded-t-2xl p-4 space-y-3 max-h-[85vh] flex flex-col animate-slide-up">
      <div class="flex items-center justify-between pb-2 border-b border-borderDark">
        <h3 class="text-sm font-extrabold text-white">Seleccionar Socio (70)</h3>
        <button onclick="closePartnerSheet()" class="p-1 text-slate-400 font-bold text-lg">✕</button>
      </div>

      <input type="text" id="txtSearchPartner" oninput="filterPartners()" placeholder="🔍 Escribe para buscar socio..." class="w-full bg-slate-900 border border-borderDark text-sm text-white p-3 rounded-xl outline-none focus:border-purple-500">

      <div id="partnerListContainer" class="overflow-y-auto flex-1 space-y-1.5 pr-1">
        <!-- Lista de socios -->
      </div>
    </div>
  </div>

  <!-- MODAL DE VISTA PREVIA CON CONTROLES INDIVIDUALES -->
  <div id="modalPreview" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-3">
    <div class="bg-cardDark border border-borderDark rounded-2xl max-w-lg w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      
      <!-- Header Modal -->
      <div class="p-3 border-b border-borderDark flex items-center justify-between bg-slate-900/50">
        <h3 class="text-xs font-extrabold text-white flex items-center gap-2">
          <span>👁️</span> Vista Previa Cartelera — <span id="lblModalPartnerName" class="text-cyan-400">---</span>
        </h3>
        <button onclick="cerrarVistaPrevia()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 hover:text-white font-bold text-sm flex items-center justify-center">
          ✕
        </button>
      </div>

      <!-- Imagen Cartelera -->
      <div class="p-3 flex-1 overflow-y-auto flex items-center justify-center bg-brandDark min-h-[300px]">
        <div id="previewSpinner" class="text-cyan-400 text-xs font-bold animate-pulse flex items-center gap-2">
          <span class="text-lg">⚡</span> Generando cartelera PNG...
        </div>
        <img id="imgPreviewCartelera" src="" alt="Vista Previa Cartelera" class="hidden w-full h-auto rounded-lg shadow-lg border border-borderDark object-contain">
      </div>

      <!-- FOOTER MODAL: CONTROLES INDIVIDUALES DEL SOCIO -->
      <div class="p-3 border-t border-borderDark bg-slate-900/80 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <!-- Modo Prueba Individual (Socio Mirado) -->
          <label class="flex items-center gap-1.5 bg-slate-800 border border-borderDark px-2.5 py-1.5 rounded-xl text-[11px] font-bold text-cyan-400 cursor-pointer">
            <span>Prueba Socio</span>
            <input type="checkbox" id="chkModalPartnerTest" class="sr-only peer" onchange="togglePartnerTestMode(this.checked)">
            <div class="w-7 h-4 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-cyan-500 relative"></div>
          </label>

          <!-- Reenviar Individual (Socio Mirado) -->
          <button onclick="dispararCarteleraSocio()" class="px-3 py-1.5 bg-amber-500/20 border border-amber-500/40 text-amber-400 hover:bg-amber-500/30 text-xs font-extrabold rounded-xl active:scale-95 transition flex items-center gap-1">
            ⚡ <span>Reenviar Socio</span>
          </button>
        </div>

        <button onclick="cerrarVistaPrevia()" class="px-4 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl hover:bg-slate-700">
          Cerrar
        </button>
      </div>

    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed top-16 right-4 bg-emerald-500 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-2xl hidden z-50">
    Mensaje
  </div>

  <script>
    const BANDERAS_MAP = {
      COP: '🇨🇴', PEN: '🇵🇪', ARS: '🇦🇷', BRL: '🇧🇷', MXN: '🇲🇽', EUR: '🇪🇺',
      USD: '🇺🇸', USDT: '🪙', PYG: '🇵🇾', VES: '🇻🇪', CLP: '🇨🇱', DOP: '🇩🇴',
      CRC: '🇨🇷', BOB: '🇧🇴', ECU: '🇪🇨', PAN: '🇵🇦', CAD: '🇨🇦'
    };

    let socios = [];
    let socioActivo = null;
    let modoPruebaGlobal = true;

    window.onload = async () => {
      await cargarMonitor();
      await cargarSocios();
    };

    async function cargarMonitor() {
      try {
        const res = await fetch('/api/v1/tasas/monitor');
        const data = await res.json();
        if (data.success && data.tasas) {
          document.getElementById('lblLoteActual').innerText = `Lote: ${data.id_tasa || 'T000'}`;
          renderMonitorGrid(data.tasas);
        }
      } catch (e) { console.error('Error monitor:', e); }
    }

    async function cargarSocios() {
      try {
        const res = await fetch('/api/v1/tasas/socios');
        const data = await res.json();
        if (data.success && data.socios?.length > 0) {
          socios = data.socios;
          selectPartner(socios[0].nombre);
        }
      } catch (e) { console.error('Error socios:', e); }
    }

    function switchTab(num) {
      document.getElementById('tab1').classList.toggle('hidden', num !== 1);
      document.getElementById('tab2').classList.toggle('hidden', num !== 2);
      document.getElementById('stickyFooter').classList.toggle('hidden', num !== 2);

      document.getElementById('btnTab1').className = num === 1
        ? 'py-2.5 rounded-lg bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-center transition'
        : 'py-2.5 rounded-lg text-slate-400 hover:text-white text-center transition';

      document.getElementById('btnTab2').className = num === 2
        ? 'py-2.5 rounded-lg bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-center transition'
        : 'py-2.5 rounded-lg text-slate-400 hover:text-white text-center transition';
    }

    function renderMonitorGrid(mapaTasas) {
      const container = document.getElementById('gridMonitor');
      container.innerHTML = Object.entries(mapaTasas).map(([code, val]) => `
        <div class="bg-cardDark border border-borderDark rounded-xl p-2.5 space-y-1">
          <div class="text-xs font-extrabold text-white flex justify-between">
            <span>${BANDERAS_MAP[code] || '🌐'} ${code}</span>
          </div>
          <div class="text-[11px] text-slate-400">PROD: <strong class="text-slate-200">${val}</strong></div>
        </div>
      `).join('');
    }

    function openPartnerSheet() {
      document.getElementById('partnerSheet').classList.remove('hidden');
      renderPartnerList();
    }

    function closePartnerSheet() {
      document.getElementById('partnerSheet').classList.add('hidden');
    }

    function renderPartnerList(filter = '') {
      const container = document.getElementById('partnerListContainer');
      const filtered = socios.filter(s => s.nombre.toLowerCase().includes(filter.toLowerCase()));

      container.innerHTML = filtered.map(s => `
        <div onclick="selectPartner('${s.nombre}')" class="p-3 bg-slate-900 border border-borderDark rounded-xl active:bg-purple-900/30 flex items-center justify-between text-xs cursor-pointer">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full ${s.activo !== false ? 'bg-emerald-400' : 'bg-rose-500'}"></span>
            <span class="font-extrabold text-white">${s.nombre}</span>
          </div>
          <span class="text-[10px] text-slate-400 font-bold bg-slate-800 px-2 py-0.5 rounded">${s.moneda_base || 'USDT'}</span>
        </div>
      `).join('');
    }

    function filterPartners() {
      renderPartnerList(document.getElementById('txtSearchPartner').value);
    }

    function selectPartner(nombre) {
      socioActivo = socios.find(s => s.nombre.toLowerCase() === nombre.toLowerCase());
      if (!socioActivo) return;

      if (!socioActivo.monedas) socioActivo.monedas = {};

      document.getElementById('lblSelectedPartner').innerText = socioActivo.nombre;
      document.getElementById('lblPartnerBase').innerText = `Base: ${socioActivo.moneda_base || 'USDT'}`;

      updatePerfilUI(socioActivo.activo !== false);
      renderChecklistGrid();
      closePartnerSheet();
    }

    function renderChecklistGrid() {
      if (!socioActivo) return;
      const container = document.getElementById('checklistGrid');
      let activeCount = 0;
      const codigos = Object.keys(BANDERAS_MAP);

      container.innerHTML = codigos.map(code => {
        const isChecked = socioActivo.monedas[code]?.activo || false;
        if (isChecked) activeCount++;

        return `
          <button onclick="toggleCountry('${code}')" class="p-3 border rounded-xl flex items-center justify-between active:scale-95 transition ${isChecked ? 'border-cyan-500/80 bg-cyan-500/10 text-white' : 'border-borderDark bg-cardDark text-slate-400'}">
            <div class="flex items-center gap-2 text-left">
              <span class="text-lg">${BANDERAS_MAP[code]}</span>
              <span class="text-xs font-bold">${code}</span>
            </div>
            <span class="text-xs">${isChecked ? '✅' : '⬜'}</span>
          </button>
        `;
      }).join('');

      document.getElementById('lblActiveCount').innerText = activeCount;
      document.getElementById('lblTotalCount').innerText = codigos.length;
    }

    function toggleCountry(code) {
      if (socioActivo.activo === false) return;
      if (!socioActivo.monedas[code]) socioActivo.monedas[code] = {};
      socioActivo.monedas[code].activo = !socioActivo.monedas[code].activo;
      renderChecklistGrid();
    }

    function setAllChecklist(status) {
      if (socioActivo.activo === false) return;
      Object.keys(BANDERAS_MAP).forEach(code => {
        if (!socioActivo.monedas[code]) socioActivo.monedas[code] = {};
        socioActivo.monedas[code].activo = status;
      });
      renderChecklistGrid();
    }

    function togglePerfilState() {
      socioActivo.activo = socioActivo.activo === false ? true : false;
      updatePerfilUI(socioActivo.activo);
    }

    function updatePerfilUI(activo) {
      const btn = document.getElementById('btnTogglePerfil');
      const banner = document.getElementById('bannerSocioOff');
      const grid = document.getElementById('checklistGrid');

      if (activo) {
        btn.innerText = 'ON';
        btn.className = 'px-3 py-2.5 rounded-xl text-[11px] font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 active:scale-95 transition';
        banner.classList.add('hidden');
        grid.classList.remove('opacity-30', 'pointer-events-none');
      } else {
        btn.innerText = 'OFF';
        btn.className = 'px-3 py-2.5 rounded-xl text-[11px] font-extrabold bg-rose-500/20 text-rose-400 border border-rose-500/40 active:scale-95 transition';
        banner.classList.remove('hidden');
        grid.classList.add('opacity-30', 'pointer-events-none');
      }
    }

    // -----------------------------------------------------------------
    // ACCIONES GENERALES (LOTE COMPLETO Y PRUEBA GENERAL)
    // -----------------------------------------------------------------

    function toggleGlobalTestMode(checked) {
      modoPruebaGlobal = checked;
      showToast(`Prueba General Lote: ${checked ? 'ON' : 'OFF'}`);
    }

    async function dispararLoteGeneral() {
      showToast('⚡ Enviando Lote Completo de Socios...');
      try {
        const res = await fetch('/api/v1/tasas/disparar-lote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ modo_prueba_global: modoPruebaGlobal })
        });
        showToast('✅ Lote enviado correctamente');
      } catch (e) {
        showToast('⚡ Lote procesado localmente');
      }
    }

    // -----------------------------------------------------------------
    // ACCIONES INDIVIDUALES (DENTRO DEL MODAL)
    // -----------------------------------------------------------------

    async function verVistaPrevia() {
      if (!socioActivo) return;

      const modal = document.getElementById('modalPreview');
      const spinner = document.getElementById('previewSpinner');
      const img = document.getElementById('imgPreviewCartelera');
      const partnerNameLbl = document.getElementById('lblModalPartnerName');
      const partnerTestChk = document.getElementById('chkModalPartnerTest');

      partnerNameLbl.innerText = socioActivo.nombre;
      partnerTestChk.checked = !!socioActivo.modo_prueba;

      modal.classList.remove('hidden');
      spinner.classList.remove('hidden');
      img.classList.add('hidden');
      img.src = '';

      try {
        const res = await fetch(`/api/v1/tasas/render/${encodeURIComponent(socioActivo.nombre)}`);
        if (!res.ok) throw new Error('Error al renderizar');

        const imageBlob = await res.blob();
        img.src = URL.createObjectURL(imageBlob);
        img.classList.remove('hidden');
        spinner.classList.add('hidden');
      } catch (e) {
        showToast('❌ Error generando cartelera');
        cerrarVistaPrevia();
      }
    }

    function togglePartnerTestMode(checked) {
      if (!socioActivo) return;
      socioActivo.modo_prueba = checked;
      showToast(`Prueba Socio (${socioActivo.nombre}): ${checked ? 'ON' : 'OFF'}`);
    }

    async function dispararCarteleraSocio() {
      if (!socioActivo) return;

      showToast(`⚡ Enviando a ${socioActivo.nombre}...`);

      try {
        const res = await fetch('/api/v1/tasas/disparar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            socio: socioActivo.nombre,
            modo_prueba: socioActivo.modo_prueba
          })
        });

        const data = await res.json();
        if (data.success) {
          showToast(`✅ ${socioActivo.nombre} enviado (${socioActivo.modo_prueba ? 'Prueba' : 'Prod'})`);
        } else {
          showToast('❌ Error al enviar socio');
        }
      } catch (e) {
        showToast('❌ Error de red');
      }
    }

    function cerrarVistaPrevia() {
      const modal = document.getElementById('modalPreview');
      const img = document.getElementById('imgPreviewCartelera');
      modal.classList.add('hidden');
      if (img.src) {
        URL.revokeObjectURL(img.src);
        img.src = '';
      }
    }

    // GUARDAR CAMBIOS DE CONFIGURACIÓN DEL SOCIO
    async function guardarCambiosSocio() {
      if (!socioActivo) return;

      try {
        const res = await fetch(`/api/v1/tasas/socios/${encodeURIComponent(socioActivo.nombre)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            monedas: socioActivo.monedas,
            activo: socioActivo.activo,
            modo_prueba: socioActivo.modo_prueba
          })
        });

        const data = await res.json();
        if (data.success) {
          showToast(`💾 Guardado en BD para ${socioActivo.nombre}`);
        } else {
          showToast('❌ Error guardando');
        }
      } catch (e) {
        showToast('❌ Error de red');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2200);
    }
  </script>
</body>
</html>
